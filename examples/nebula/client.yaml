pki:
  ca: /home/{USER}/nebula-ca/ca.crt
  cert: /home/{USER}/nebula-ca/client.crt
  key: /home/{USER}/nebula-ca/client.key

static_host_map:
  "10.99.0.1": ["IP:4242"]

lighthouse:
  am_lighthouse: false
  hosts:
    - "10.99.0.1"

listen:
  host: 0.0.0.0
  port: 0

punchy:
  punch: true
  respond: true

tun:
  disabled: false
  dev: nebula1
  mtu: 1300

logging:
  level: info
  format: text

firewall:
  outbound_action: drop
  inbound_action: drop

  outbound:
    - port: any
      proto: any
      host: any

  inbound:
    - port: any
      proto: icmp
      host: any