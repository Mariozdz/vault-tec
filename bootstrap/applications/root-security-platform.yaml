apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-security-platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:Mariozdz/vault-tec.git
    targetRevision: main
    path: argocd/applications/lab/security-platform

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true