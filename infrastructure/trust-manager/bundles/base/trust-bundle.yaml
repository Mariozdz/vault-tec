apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: cluster-trust
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:

  sources:
    - useDefaultCAs: false
    - secret:
        name: root-ca
        key: ca.crt

  target:

    configMap:
      key: ca.crt

    namespaceSelector: {}