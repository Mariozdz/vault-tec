apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-vault-gateway
  namespace: nebula
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nebula-vault-gateway
  template:
    metadata:
      labels:
        app: nebula-vault-gateway
    spec:

      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: nebula-vault-gateway
      automountServiceAccountToken: false

      containers:
        - name: nebula
          image: nebulaoss/nebula:latest
          args:
            - "-config"
            - "/etc/nebula/config/config.yml"
          ports:
            - name: nebula-udp
              containerPort: 4242
              protocol: UDP
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: nebula-config
              mountPath: /etc/nebula/config
              readOnly: true
            - name: nebula-certs
              mountPath: /etc/nebula/certs
              readOnly: true
            - name: dev-net-tun
              mountPath: /dev/net/tun

        - name: vault-tcp-proxy
          image: alpine/socat:latest
          args:
            - TCP-LISTEN:8200,fork,reuseaddr
            - TCP:vault.vault.svc.cluster.local:8200
          ports:
            - name: vault
              containerPort: 8200
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false

      volumes:
        - name: nebula-config
          configMap:
            name: nebula-vault-gateway-config

        - name: nebula-certs
          secret:
            secretName: nebula-vault-gateway-certs
            defaultMode: 0400

        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
