apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server-cert
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: vault-tls
  issuerRef:
    name: vault-ca-issuer
    kind: ClusterIssuer
  commonName: vault.vault.svc.cluster.local
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - https://127.0.0.1
  ipAddresses: 
    - 127.0.0.1
  privateKey:
    algorithm: RSA
    size: 2048