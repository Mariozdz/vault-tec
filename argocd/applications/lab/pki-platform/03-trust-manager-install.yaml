apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trust-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: default

  sources:
  - repoURL: https://charts.jetstack.io
    chart: trust-manager
    targetRevision: v0.21.1
    helm:
      releaseName: trust-manager
      valueFiles:
        - $values/infrastructure/trust-manager/install/values/lab.yaml

  - repoURL: https://github.com/Mariozdz/vault-tec.git
    targetRevision: main
    ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true