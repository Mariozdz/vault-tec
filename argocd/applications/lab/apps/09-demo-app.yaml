apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: curl-application
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  
  source:
    repoURL: git@github.com:Mariozdz/vault-tec.git
    path: apps/curl-app/overlays/lab
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: curl-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true